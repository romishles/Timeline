name: Build timeline database

# Rebuilds assets/timeline_data.db from data/timeline.xlsx and data/videos.csv.
# The new database is built and validated in a temporary file first; the live
# database is only replaced when every check passes.
#
# The commit made by this workflow uses the built-in GITHUB_TOKEN, so it does
# not start another run, and it only changes assets/timeline_data.db, which is
# not one of the trigger paths.

on:
  push:
    branches: [main]
    paths:
      - data/timeline.xlsx
      - data/videos.csv
      - assets/videos/manifest.json
      - assets/images/manifest.json
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Allow the new database to have more than 5 fewer items or 10% fewer links
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: build-timeline-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xlsx_to_sqlite/requirements.txt

      - name: Install pinned requirements
        run: pip install -r xlsx_to_sqlite/requirements.txt

      - name: Build and validate into a temporary database
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: |
          python xlsx_to_sqlite/xlsx_to_sqlite.py data/timeline.xlsx "$RUNNER_TEMP/timeline_data.db" \
            --videos data/videos.csv \
            --manifest assets/videos/manifest.json \
            --images assets/images/manifest.json \
            --baseline assets/timeline_data.db \
            $ALLOW_SHRINK

      - name: Compare with the live database
        id: compare
        run: |
          set +e
          python xlsx_to_sqlite/db_diff.py assets/timeline_data.db "$RUNNER_TEMP/timeline_data.db" > "$RUNNER_TEMP/changes.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
          case $status in
            0) echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes; the live database stays as it is." ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT"; cat "$RUNNER_TEMP/changes.md" ;;
            *) exit $status ;;
          esac

      - name: Replace the live database and commit
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP/timeline_data.db" assets/timeline_data.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/timeline_data.db
          git commit -m "Rebuild timeline database from data/timeline.xlsx" -m "Built from $GITHUB_SHA by workflow run $GITHUB_RUN_ID."
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Ask GitHub Pages to rebuild
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null; then
            echo "Requested a GitHub Pages rebuild."
          else
            echo "::warning title=Pages rebuild not requested::The database was updated, but asking GitHub Pages to rebuild failed. Pages normally rebuilds by itself after the commit; if the site does not update within a few minutes, check Settings > Pages."
          fi
