name: Build timeline database

# Rebuilds assets/timeline_data.db from data/timeline.xlsx and data/videos.csv.
# The new database is built and validated in a temporary file first; the live
# database is only replaced when every check passes.
#
# The commits made by this workflow use the built-in GITHUB_TOKEN, so they do
# not start another run (pushes made with GITHUB_TOKEN never trigger
# workflows, even when they change a trigger path such as data/videos.csv).
#
# If the upload deleted the parent item of a video, the build removes that
# video's line from data/videos.csv (--prune-videos) and it is committed
# before the database; the video's files are then removed with the other
# leftovers of deleted items.

on:
  push:
    branches: [main]
    paths:
      - data/timeline.xlsx
      - data/videos.csv
      - assets/videos/manifest.json
      - assets/images/manifest.json
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Allow the new database to have more than 5 fewer items or 10% fewer links
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: build-timeline-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xlsx_to_sqlite/requirements.txt

      - name: Install pinned requirements
        run: pip install -r xlsx_to_sqlite/requirements.txt

      - name: Build and validate into a temporary database
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: |
          python xlsx_to_sqlite/xlsx_to_sqlite.py data/timeline.xlsx "$RUNNER_TEMP/timeline_data.db" \
            --videos data/videos.csv \
            --manifest assets/videos/manifest.json \
            --images assets/images/manifest.json \
            --baseline assets/timeline_data.db \
            --prune-videos \
            --prune-summary "$RUNNER_TEMP/pruned.md" \
            --prune-commit-message "$RUNNER_TEMP/pruned_message.txt" \
            $ALLOW_SHRINK

      # Only reached when the whole build passed; the build changes
      # data/videos.csv only then, and only for parents deleted in this upload.
      - name: Commit removed video lines
        id: pruned
        run: |
          if [ -f "$RUNNER_TEMP/pruned_message.txt" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf '\nBuilt from %s by workflow run %s.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/pruned_message.txt"
            git add data/videos.csv
            git commit -F "$RUNNER_TEMP/pruned_message.txt"
            cat "$RUNNER_TEMP/pruned.md" >> "$GITHUB_STEP_SUMMARY"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with the live database
        id: compare
        run: |
          set +e
          python xlsx_to_sqlite/db_diff.py assets/timeline_data.db "$RUNNER_TEMP/timeline_data.db" > "$RUNNER_TEMP/changes.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
          case $status in
            0) echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes; the live database stays as it is." ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT"; cat "$RUNNER_TEMP/changes.md" ;;
            *) exit $status ;;
          esac

      - name: Replace the live database and commit
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp assets/timeline_data.db "$RUNNER_TEMP/previous.db"
          cp "$RUNNER_TEMP/timeline_data.db" assets/timeline_data.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/timeline_data.db
          git commit -m "Rebuild timeline database from data/timeline.xlsx" -m "Built from $GITHUB_SHA by workflow run $GITHUB_RUN_ID."

      # Removes only the image/video files and manifest entries of ids that were
      # items in the previous database and are not items now, as a separate
      # commit. It never blocks the database rebuild: over a limit it only warns.
      - name: Remove leftover files of deleted items
        id: leftovers
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        run: |
          python xlsx_to_sqlite/find_orphans.py --apply \
            --removed-since "$RUNNER_TEMP/previous.db" \
            --summary "$RUNNER_TEMP/leftovers.md" \
            --commit-message "$RUNNER_TEMP/leftovers_message.txt"
          cat "$RUNNER_TEMP/leftovers.md" >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --cached --quiet; then
            git commit -F "$RUNNER_TEMP/leftovers_message.txt"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.compare.outputs.changed == 'true'
        env:
          LEFTOVERS_OUTCOME: ${{ steps.leftovers.outcome }}
          LEFTOVERS_COMMITTED: ${{ steps.leftovers.outputs.committed }}
          PRUNED_COMMITTED: ${{ steps.pruned.outputs.committed }}
        run: |
          if [ "$LEFTOVERS_OUTCOME" = "failure" ]; then
            echo "::warning title=Leftover files not removed::Removing the leftover files failed; the database rebuild is still pushed. Run 'Clean up orphans' (dry run first)."
          fi
          git reset -q --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
          if [ "$LEFTOVERS_COMMITTED" = "true" ]; then
            sha=$(git log -1 --format=%H)
            {
              echo "### How to undo the file removal"
              echo
              echo "Run \`git revert $sha\` and push. That restores the removed files and manifest entries exactly; the database stays as it is."
              echo
              echo "Without git: open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha, open the commit before it with **Browse files**, download the removed files and upload them to the same folders, then add their manifest entries back (shown in red in this commit's changes)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PRUNED_COMMITTED" = "true" ]; then
            pruned_sha=$(git log -4 --format='%H %s' | awk '!found && $2 == "Remove" && $3 == "videos" && $4 == "of" { print $1; found = 1 }')
            {
              echo
              echo "### How to bring back a deleted item with its video"
              echo
              if [ "$LEFTOVERS_COMMITTED" = "true" ]; then
                echo "Run \`git revert $(git log -1 --format=%H) $pruned_sha\`, put the item's row back in \`data/timeline.xlsx\` (with any links other items had to it), and push all of it together. The first revert restores the files and manifest entries, the second the line in \`data/videos.csv\`; the next rebuild then adds the item and its video again."
              else
                echo "The files were not removed. Run \`git revert $pruned_sha\` (it restores the line in \`data/videos.csv\`), put the item's row back in \`data/timeline.xlsx\` (with any links other items had to it), and push both together; the next rebuild then adds the item and its video again."
              fi
              echo
              echo "If something is missing (for example the row is back but not its pictures), the rebuild stops and names it; nothing on the site breaks."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null; then
            echo "Requested a GitHub Pages rebuild."
          else
            echo "::warning title=Pages rebuild not requested::The database was updated, but asking GitHub Pages to rebuild failed. Pages normally rebuilds by itself after the commit; if the site does not update within a few minutes, check Settings > Pages."
          fi
