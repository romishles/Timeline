name: Clean up orphans

# Finds image and video files that no item uses any more (see
# xlsx_to_sqlite/find_orphans.py). Runs only when started by hand.
# By default it is a dry run that only lists what it would remove; files are
# removed only when "apply" is ticked AND "confirm" is exactly DELETE.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Remove the orphans (leave unticked for a dry run that changes nothing)
        type: boolean
        default: false
      confirm:
        description: Type DELETE to allow removing files (only used when apply is ticked)
        type: string
        default: ""
      max_files:
        description: Most files to remove in one run
        type: number
        default: 40
      allow_shrink:
        description: Allow it even if the last rebuild removed more than 5 items (after a rebuild run with allow_shrink)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

# Same group as "Build timeline database", so the two never run at the same time.
concurrency:
  group: build-timeline-db
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xlsx_to_sqlite/requirements.txt

      - name: Install pinned requirements
        run: pip install -r xlsx_to_sqlite/requirements.txt

      - name: Decide dry run or apply
        id: mode
        env:
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" = "DELETE" ]; then
            echo "flag=--apply" >> "$GITHUB_OUTPUT"
            echo "Apply run: orphans will be removed."
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            if [ "$APPLY" = "true" ]; then
              reason="apply was ticked but confirm was not exactly DELETE"
            else
              reason="apply was not ticked"
            fi
            echo "Dry run ($reason): nothing will be changed."
            printf '> **Dry run**: %s, so nothing was changed.\n\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find orphans
        env:
          APPLY_FLAG: ${{ steps.mode.outputs.flag }}
          MAX_FILES: ${{ inputs.max_files }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: |
          python xlsx_to_sqlite/find_orphans.py $APPLY_FLAG $ALLOW_SHRINK \
            --max-files "$MAX_FILES" \
            --summary "$RUNNER_TEMP/orphans.md" \
            --commit-message "$RUNNER_TEMP/commit_message.txt" || status=$?
          cat "$RUNNER_TEMP/orphans.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      - name: Commit and push the removal
        id: commit
        if: steps.mode.outputs.flag == '--apply'
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to remove."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F "$RUNNER_TEMP/commit_message.txt"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null; then
            echo "Requested a GitHub Pages rebuild."
          else
            echo "::warning title=Pages rebuild not requested::The orphans were removed, but asking GitHub Pages to rebuild failed. Pages normally rebuilds by itself after the commit; if the site does not update within a few minutes, check Settings > Pages."
          fi
